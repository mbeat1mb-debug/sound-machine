<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Sound Machine</title>
  <!-- Home-screen icon + standalone look (full offline PWA arrives in Phase 4) -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Sound Machine</h1>

    <div id="sound-grid" role="group" aria-label="Sounds"></div>

    <div class="controls">
      <button id="play-pause" disabled aria-label="Play or pause">Play</button>
      <label class="volume">
        <span>Volume</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      </label>
    </div>

    <p id="status" aria-live="polite"></p>
  </main>

  <!-- All audio routes through this element so iOS lock-screen controls work (Phase 2). -->
  <audio id="audio-el" playsinline></audio>

  <script type="module" src="js/app.js"></script>
</body>
</html>
